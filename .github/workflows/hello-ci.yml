# 1. trigger, when the workflow wake up
on:
  push:
    branches: ["main"]

# 2. the works which must be executed
jobs:
  build-and-push:
    runs-on: ubuntu-latest # virtual github server

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
 
      - name: Build and Push Docker Images
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/my-first-devops-app:latest
